<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Aluno</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background: #fff;
        padding: 30px;
        width: 450px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    input:focus {
        outline: none;
        border-color: #1976d2;
    }

    button {
        width: 100%;
        background: #1976d2;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #1565c0;
    }

    .mensagem {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
    }

    .sucesso {
        color: green;
    }

    .erro {
        color: red;
    }
</style>

</head>
<body>

<div class="container">
    <h1>Cadastro de Aluno</h1>

    <form id="formAluno" method="POST" action="/cadastrar/aluno">
        <div class="form-group">
            <label for="matricula">Matrícula</label>
            <input
                type="text"
                id="matricula"
                name="matricula"
                maxlength="20"
                required>
        </div>

        <div class="form-group">
            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="100"
                required>
        </div>

        <div class="form-group">
            <label for="dataNascimento">Data de Nascimento</label>
            <input
                type="date"
                id="dataNascimento"
                name="data_nascimento"
                required>
        </div>

        <button type="submit">Salvar</button>

        <div id="mensagem" class="mensagem"></div>
    </form>
</div>

</body>
</html>
